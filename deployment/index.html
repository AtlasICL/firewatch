<!DOCTYPE html>
<html>
  <head>
    <title>Firewatch</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <style>

      main {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      #map {
        height: 500px;
        width: 100%; 
        border-radius: 8px;
      }

      #controls {
          background: #f3f4f6;
          padding: 20px;
          margin-bottom: 20px;
          border-radius: 8px;
      }

      #coordinates {
          display: block;
          width: 100%;
          box-sizing: border-box;
          margin-bottom: 10px;
          padding: 10px;
      }

      #plotButton {
          background: #dc2626;
          color: white;
          padding: 10px 20px;
          border: none;
          border-radius: 6px;
          cursor: pointer;
      }
     </style>
  </head>
  <body>
    <main>


      <div id="controls">
          <h3>Enter Fire Coordinates</h3>

          <textarea
              id="coordinates"
              rows="6"
              placeholder="Latitude, Longitude (one pair per line)"
          ></textarea>

          <button id="plotButton">Plot Coordinates</button>
      </div>

      <div id="map"></div>
    </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="main.js"></script>
  </body>
</html>

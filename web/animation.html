<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quickhull Animation | Firewatch</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <main class="page">
    <a href="index.html" class="back-link">← Back to Firewatch</a>

    <h1>Quickhull Animation</h1>
    <p class="subtle">
      How a convex hull is constructed using the Quickhull algorithm.
    </p>

    <section class="animation-card">
      <img
        id="animationImage"
        src="img/quickhull_visuals/1.png"
        alt="Quickhull algorithm step 1"
      >

      <div class="animation-controls">
        <button id="previousButton" type="button" aria-label="Previous step">←</button>
        <span id="stepCounter">1 / 17</span>
        <button id="nextButton" type="button" aria-label="Next step">→</button>
      </div>
    </section>
  </main>

  <script src="animation.js"></script>
</body>
</html>

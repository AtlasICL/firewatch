name: Deploy Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Package Quickhull Lambda Function
        run: |
          mkdir -p package
          cp -r src/* package/
          cp deployment/quickhull_lambda.py package/

          zip -r quickhull_function.zip package/

      - name: Update Quickhull Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name quickhull \
            --zip-file fileb://quickhull_function.zip \
            --publish
      
      - name: Update Presign URL Function Code
        run: |
          zip url_presign.zip deployment/transfer_lambda.py \
            --function-name generate_url \
            --zip-file fileb://url_presign.zip  \
            --publish
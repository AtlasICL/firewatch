name: Deploy Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Package Quickhull Lambda Function
        run: |
          # AWS handler is src.quickhull_lambda.lambda_handler, so the
          # zip keeps the repo's src/ layout.
          rm -f quickhull_function.zip
          zip -r quickhull_function.zip src -x '*__pycache__*'

      - name: Update Quickhull Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name quickhull \
            --zip-file fileb://quickhull_function.zip \
            --publish
      
      - name: Update Presign URL Function Code
        run: |
          zip url_presign.zip src/__init__.py src/transfer_lambda.py
          aws lambda update-function-code \
            --function-name generate_url \
            --zip-file fileb://url_presign.zip  \
            --publish